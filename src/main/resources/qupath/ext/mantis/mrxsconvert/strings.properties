name = MRXS to OME-TIFF Converter
description = Converts fluorescence .mrxs slides to .ome.tiff files that QuPath reads correctly.

menu.convert = Convert MRXS to OME-TIFF…
menu.not-implemented = Not implemented yet.

# Conversion failures (spec 03), shown to users in the batch summary. MessageFormat: double any apostrophe.
runner.failed.log = Could not write the log file {0}.
runner.failed.output-exists = The output file already exists: {0}
runner.failed.busy = Another conversion is already writing {0}.
runner.failed.stale-partial = Could not delete the unfinished output file left by an earlier conversion: {0}. Close any program using it and try again.
runner.failed.workspace = Could not create a temporary folder: {0}
runner.failed.start = Could not start the conversion tool: {0}
runner.failed.extract = Reading the slide failed (exit code {0}). See the log for details.
runner.failed.write = Writing the OME-TIFF failed (exit code {0}). See the log for details.
runner.failed.no-output = The conversion finished but wrote no output file. See the log for details.
runner.failed.output-appeared = A file named {0} appeared during the conversion. It was not overwritten.
runner.failed.rename = Could not rename the finished file to {0}: {1}
runner.failed.io = Unexpected error: {0}
